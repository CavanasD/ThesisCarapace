spring.application.name=carapace
server.port=8080

# FMS 内网地址
cfms.internal.url=${CFMS_INTERNAL_URL:wss://localhost:5104}
cfms.tls.ca-cert=${CFMS_TLS_CA_CERT:}

#  WAF 规则开关（true=拦截开启）
defender.rule.sqli.enabled=${WAF_SQLI_ENABLED:true}
defender.rule.xss.enabled=${WAF_XSS_ENABLED:true}
defender.rule.path-traversal.enabled=${WAF_PATH_TRAVERSAL_ENABLED:true}
defender.rule.cmd-injection.enabled=${WAF_CMD_INJECTION_ENABLED:true}
defender.rule.file-type.enabled=${WAF_FILE_TYPE_ENABLED:true}

# Lab vulnerabilities are inert unless LAB_MODE=true. Individual switches still
# default to false so a production deployment cannot expose a lab accidentally.
lab.mode=${LAB_MODE:false}
vuln.ssrf.enabled=${VULN_SSRF_ENABLED:false}
vuln.jwt.alg-none.enabled=${VULN_JWT_ALG_NONE_ENABLED:false}
vuln.cors.enabled=${VULN_CORS_ENABLED:false}
vuln.log4shell.enabled=${VULN_LOG4SHELL_ENABLED:false}

# Actuator（默认只开 health；演示时改成 * 即可）
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.env.enabled=false

# JWT 密钥（WAF 管理面板用）
security.jwt.secret=Carapace-Change-This-In-Production
security.admin.token=${CARAPACE_ADMIN_TOKEN:}

# CORS / WebSocket browser origins (comma separated, wildcards rejected)
cors.allowed-origins=${CARAPACE_ALLOWED_ORIGINS:http://localhost:5173}

# WAF event persistence back-pressure
waf.persistence.queue-capacity=${WAF_EVENT_QUEUE_CAPACITY:4096}
waf.persistence.batch-size=${WAF_EVENT_BATCH_SIZE:100}
waf.persistence.flush-interval-ms=${WAF_EVENT_FLUSH_INTERVAL_MS:250}
